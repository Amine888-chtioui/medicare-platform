# ====================================================
# Production profile
# Activate with: SPRING_PROFILES_ACTIVE=prod
# ====================================================

# Never let Hibernate modify a production schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Do not leak internal details in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Reverse proxy / HTTPS deployments
server.forward-headers-strategy=framework

# Conservative logging
logging.level.root=INFO
logging.level.com.medicare.platform=INFO
logging.level.org.springframework.security=WARN
