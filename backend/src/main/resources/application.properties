# ====================================================
# MediCare Platform - Backend configuration
# All secrets are provided through environment variables.
# ====================================================

# Server configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Compression for JSON responses
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# Cap client-requested page sizes to protect the database
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# MySQL Database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# CORS allowed origins (comma separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

# Only enable behind a trusted reverse proxy (nginx, Traefik, etc.).
# When false, X-Forwarded-For is ignored and the socket address is used.
app.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# Public appointment form anti-spam limit (per IP)
public.rate-limit.max-requests=${PUBLIC_RATE_LIMIT_MAX:10}
public.rate-limit.window-minutes=${PUBLIC_RATE_LIMIT_WINDOW_MINUTES:60}

# JWT configuration (secret must be at least 32 bytes; override in production)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Application info
app.name=MediCare Platform
app.version=1.0.0

# Logging
logging.level.root=INFO
logging.level.com.medicare.platform=INFO
